<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="1024" height="1024" shape-rendering="geometricPrecision">
  <!--
    OchaComet アプリアイコン。
    原本 assets/icons/128.png（128px しか無い）から、色・角度・長さ・太さを実測して
    ベクターで再構成したもの。引き伸ばしではないので任意サイズで鮮明。
    実測値は scratchpad/shape.js による主成分分析の結果。
  -->
  <rect width="128" height="128" fill="#182a3a"/>

  <g stroke-linecap="round" fill="none">
    <!-- 長い明るい緑（-45.3°, 太さ6.7） -->
    <line x1="43.6" y1="85.8" x2="115.0" y2="13.8" stroke="#7eaa5c" stroke-width="6.7"/>
    <!-- 中くらいの深緑（-45.3°, 太さ5.2） -->
    <line x1="47.1" y1="59.5" x2="77.9" y2="28.5" stroke="#278958" stroke-width="5.2"/>
    <!-- くすんだ緑（-46.0°, 太さ5.0） -->
    <line x1="66.4" y1="86.9" x2="94.9" y2="57.4" stroke="#657b55" stroke-width="5.0"/>
  </g>

  <!-- 四芒星（中心 26.7,99.3 / 半径 17） -->
  <path fill="#b8b4a6" transform="translate(26.7 99.3) scale(17)"
        d="M 0,-1 C 0.08,-0.34 0.34,-0.08 1,0 C 0.34,0.08 0.08,0.34 0,1 C -0.08,0.34 -0.34,0.08 -1,0 C -0.34,-0.08 -0.08,-0.34 0,-1 Z"/>
</svg>
